name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev,ui,memwall,mem0,agent]"
      - run: pytest
      - run: riffnel-memguard demo stale
      - run: riffnel-memguard demo erasure
      - run: riffnel-memguard demo sqlite-stale
      - run: riffnel-memguard demo sqlite-erasure
      - run: riffnel-memguard demo real-stale
      - run: riffnel-memguard demo real-erasure
      - run: riffnel-memguard benchmark
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t riffnel-memguard .
      - run: docker run --rm riffnel-memguard riffnel-memguard demo stale
      - run: docker run --rm riffnel-memguard riffnel-memguard demo erasure
