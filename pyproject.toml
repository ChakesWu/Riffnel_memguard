[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "riffnel-memguard"
version = "0.1.0.dev0"
description = "Memory error investigation and correction verification for AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "pydantic>=2",
    "typer",
    "rich",
    "jinja2",
    "scikit-learn",
]

[project.optional-dependencies]
ui = ["streamlit"]
memwall = ["memwall>=0.6.1,<0.7"]
mem0 = ["mem0ai>=2.2.1,<2.3"]
embedder = ["fastembed>=0.9,<0.10"]
agent = ["pydantic-ai-slim[openai]>=2.58,<3"]
dev = ["pytest"]

[project.scripts]
riffnel-memguard = "riffnel_memguard.cli:app"

[tool.setuptools.packages.find]
include = ["riffnel_memguard*"]

[tool.setuptools.package-data]
"riffnel_memguard.examples.bank" = ["*.json", "*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
